services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  pgsql:
    image: postgres:latest
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Enable TLS with a throwaway self-signed cert (regenerated each start) so the `ssl` passthrough
    # can be live-tested. `ssl=on` makes SSL AVAILABLE, not required, so existing plaintext test
    # connections are unaffected. The entrypoint is overridden to generate the cert as root with the
    # perms Postgres requires (key 0600, owned by postgres), then hand off to the normal entrypoint.
    entrypoint:
      - /bin/bash
      - -c
      - |
        openssl req -new -x509 -days 3650 -nodes -text -subj '/CN=localhost' \
          -out /var/lib/postgresql/server.crt -keyout /var/lib/postgresql/server.key 2>/dev/null
        chmod 600 /var/lib/postgresql/server.key
        chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # SQL Server / Azure SQL (Class A row-store — the first warehouse-adjacent destination).
  # azure-sql-edge is the lightweight, cross-arch (amd64/arm64) Azure-branded image; it speaks
  # the same T-SQL/TDS as Azure SQL Database. Schema bootstrap (the "test_schema" schema) is done
  # by the sqlserver adapter/test harness — SQL Server has no /docker-entrypoint-initdb.d hook.
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    # azure-sql-edge ships no sqlcmd, so probe the TDS port instead (bash is available on the image).
    # Combined with start_period this reports healthy once the engine is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql_data:
  pg_data:
  sqlserver_data:
